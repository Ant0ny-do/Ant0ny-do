name: Generate Snake

on:
  # Запуск по расписанию: каждый день в полночь
  schedule:
    - cron: "0 0 * * *"
  
  # Возможность запустить сценарий вручную в любой момент
  workflow_dispatch:
  
  # Запуск при каждом пуше в основную ветку
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Генерация файлов змейки (SVG и GIF)
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ant0ny-do
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Пуш сгенерированных файлов в специальную ветку output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
